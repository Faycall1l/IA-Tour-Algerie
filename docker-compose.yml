services:
  api:
    build: .
    image: athar-os:latest
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ATHAR_DATABASE__URL: postgresql+asyncpg://athar:athar_pass@db:5432/athar_db?sslmode=disable
      ATHAR_QDRANT__HOST: qdrant
      ATHAR_QDRANT__API_KEY: "${QDRANT_API_KEY:-}"
      ATHAR_REDIS__HOST: redis
      ATHAR_MINIO__ENDPOINT: minio:9000
      ATHAR_AUTH__JWT_PRIVATE_KEY: "${AUTH_JWT_PRIVATE_KEY:-}"
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  db:
    image: postgres:16.4-alpine
    user: "999:999"
    expose:
      - "5432"
    environment:
      POSTGRES_USER: athar
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: athar_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp
      - /var/run/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athar"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID

  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    expose:
      - "6333"
      - "6334"
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  redis:
    image: redis:7.4-alpine
    expose:
      - "6379"
    command: ["redis-server"]
    volumes:
      - redis_data:/data
    tmpfs:
      - /tmp
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID

  minio:
    image: minio/minio:latest
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    expose:
      - "9000"
      - "9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    volumes:
      - minio_data:/data
    tmpfs:
      - /tmp
    command: server /data --console-address ":9001"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  pg_data:
  qdrant_data:
  redis_data:
  minio_data:

networks:
  backend:
    driver: bridge
